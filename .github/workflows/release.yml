name: Release App

on:
  push:
    tags:
      - 'v*' # Chạy tự động khi push tag mới bắt đầu bằng v, ví dụ: v2.4.0-PRO-MAX

permissions:
  contents: write # Cần quyền write để tạo Release và upload Assets

jobs:
  release:
    runs-on: windows-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Run Build
        run: npm run build

      - name: Build & Publish Windows Installer
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: npx electron-builder --win --publish always
