name: CI & Release App

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  ci:
    name: Run CI & Quality Checks
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Run Typecheck
        run: npm run typecheck

      - name: Run Unit Tests
        run: npm test

      - name: Verify Web & Main Build
        run: npm run build

  release:
    name: Build & Release App
    needs: ci
    if: (github.event_name == 'push' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v'))) || github.event_name == 'workflow_dispatch'
    runs-on: windows-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Extract App Version
        id: get_version
        shell: bash
        run: |
          VERSION=$(node -p "require('./package.json').version")
          echo "VERSION=$VERSION" >> $GITHUB_ENV
          echo "version=$VERSION" >> $GITHUB_OUTPUT

      - name: Build Windows Executable
        run: npm run build && npx electron-builder --win --publish never

      - name: Extract Release Notes from CHANGELOG.md
        shell: bash
        run: |
          node -e "
            const fs = require('fs');
            const version = process.env.VERSION.replace(/^v/, '');
            const content = fs.readFileSync('CHANGELOG.md', 'utf-8');
            const lines = content.split('\n');
            let capturing = false;
            const captured = [];
            for (const line of lines) {
              const m = line.match(/^##\s+\[?v?([0-9]+\.[0-9]+\.[0-9]+[^\]\s]*)\]?/i);
              if (m) {
                const v = m[1].replace(/^v/, '');
                if (v === version) {
                  capturing = true;
                  continue;
                } else if (capturing) {
                  break;
                }
              } else if (capturing) {
                if (line.match(/^#{1,2}\s+/)) break;
                captured.push(line);
              }
            }
            const notes = captured.join('\n').trim();
            fs.writeFileSync('RELEASE_NOTES.md', notes || 'Cải tiến hiệu năng và sửa lỗi.');
          "

      - name: Publish Public GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ env.VERSION }}
          name: KT ADB Tool Pro v${{ env.VERSION }}
          body_path: RELEASE_NOTES.md
          files: |
            dist/*.exe
            dist/*.blockmap
          draft: false
          prerelease: false
          generate_release_notes: false
          make_latest: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
